<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Precision Navigation Chronometer v7.6.8</title>
    <style>
        /* Base color scheme and variables */
        :root {
            --bg-body: #f0f2f5;
            --bg-card: white;
            --text-main: #1a1a1a;
            --bg-dark: #001529;
            --highlight-red: #ff4d4d;
            --aviation-orange: #ff8c00;
            --daylight-gold: #fff5d1;
            --night-blue: #1a3a5a; 
            --clock-size: 650px;
            --inner-disk-size: 380px;
            --center-mask-size: 180px;
            --border-ui: #e0e0e0;
            --ring-label-color: #ffffff;
            --ring-label-opacity: 1;
            --ring-label-filter: drop-shadow(0px 1px 2px rgba(0, 0, 0, 0.8));
            
            /* Tactical Green Variable for easy maintenance */
            --tactical-green: #00ff41;
        }

        /* Night mode overrides (Tactical Green Style) */
        body.night-mode {
            --bg-body: #020502;
            --bg-card: #0a110a;
            --text-main: var(--tactical-green);
            --border-ui: #1a2e1a;
            --daylight-gold: #0d1a0d;
            --highlight-red: var(--tactical-green);
            --aviation-orange: var(--tactical-green);
            --night-blue: #050a05;
            --ring-label-color: var(--tactical-green);
            --ring-label-opacity: 0.7;
            --ring-label-filter: none;
        }

        body {
            background-color: var(--bg-body);
            transition: background-color 0.3s ease;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            min-height: 100vh; margin: 0;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            color: var(--text-main);
        }

        .branding-plate { margin-bottom: 10px; text-align: center; }
        .branding-plate h1 { margin: 0; font-size: 1.2rem; letter-spacing: 5px; color: var(--text-main); font-weight: 900; text-transform: uppercase; }
        .branding-plate span { font-size: 0.6rem; letter-spacing: 2px; color: #666; font-weight: bold; text-transform: uppercase; }

        .version-tag {
            position: fixed; top: 20px; right: 20px;
            background: #222; color: #00ff00;
            padding: 5px 12px; border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.7rem; font-weight: bold;
            z-index: 2000; border: 1px solid #444;
        }

        .header-controls {
            background: var(--bg-card); padding: 12px 30px;
            border-radius: 50px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: flex; gap: 15px; align-items: center;
            margin-bottom: 25px; border: 1px solid var(--border-ui);
            min-width: 720px;
        }

        .night-toggle {
            display: flex; align-items: center; gap: 8px;
            padding-right: 15px; border-right: 2px solid var(--border-ui);
            flex-shrink: 0;
        }
        
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc; transition: .4s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 14px; width: 14px;
            left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--tactical-green); }
        input:checked + .slider:before { transform: translateX(20px); }

        .input-group { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .input-group label { font-size: 0.6rem; font-weight: 800; color: #888; text-transform: uppercase; }
        
        input[type="number"] { 
            border: 1px solid var(--border-ui); padding: 4px; border-radius: 6px; 
            width: 45px; font-weight: bold; text-align: center; 
            outline: none; background: var(--bg-card); color: var(--text-main);
        }

        .fs-btn {
            background: var(--bg-dark); color: white;
            border: none; padding: 6px 14px; border-radius: 6px;
            font-size: 0.65rem; font-weight: 900; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px;
            transition: all 0.2s; border: 1px solid #444;
        }
        .fs-btn:hover { background: #1a3a5a; transform: translateY(-1px); }
        body.night-mode .fs-btn { background: #0a110a; color: var(--tactical-green); border-color: var(--tactical-green); }

        #zoneText {
            font-weight: 800; border-left: 2px solid var(--border-ui); 
            padding-left: 15px; font-size: 0.8rem;
            min-width: 170px; display: inline-block; flex-shrink: 0;
        }

        .clock-canvas {
            position: relative;
            width: var(--clock-size); height: var(--clock-size);
            background-color: var(--bg-dark); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            border: 8px solid #222;
        }

        .clock-canvas::after {
            content: '';
            position: absolute;
            width: 14px; height: 14px;
            background: #111;
            border: 2px solid var(--aviation-orange);
            border-radius: 50%;
            z-index: 150;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        .curved-labels { position: absolute; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
        .curved-labels text {
            fill: var(--ring-label-color);
            fill-opacity: var(--ring-label-opacity);
            filter: var(--ring-label-filter);
            font-size: 9px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 3px;
            transition: all 0.3s ease;
            paint-order: stroke fill;
            stroke: rgba(0,0,0,0.15);
            stroke-width: 0.5px;
        }

        .inner-disk {
            position: absolute; width: var(--inner-disk-size); height: var(--inner-disk-size);
            background-color: var(--night-blue); border-radius: 50%;
            z-index: 2; display: flex; justify-content: center; align-items: center;
            overflow: hidden; box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .daylight-overlay { position: absolute; width: 100%; height: 100%; z-index: 1; transition: background 0.5s; }
        .hour-node { position: absolute; width: 40px; text-align: center; font-weight: bold; left: calc(50% - 20px); top: calc(50% - 15px); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .zulu-ring { color: rgba(255,255,255,0.4); font-size: 1.4rem; z-index: 5; }
        .local-ring { color: rgba(26,26,26,0.5); font-size: 1.1rem; z-index: 15; } 
        
        body.night-mode .zulu-ring { color: var(--tactical-green); opacity: 0.3; }
        body.night-mode .local-ring { color: var(--tactical-green); opacity: 0.2; }
        .active-red { color: var(--highlight-red) !important; font-size: 1.8rem; text-shadow: 0 0 10px rgba(255, 255, 255, 0.4) !important; z-index: 20; opacity: 1 !important; }

        .hand { 
            position: absolute; bottom: 50%; left: calc(50% - 2px); 
            transform-origin: bottom center; z-index: 100; pointer-events: none;
            transition: transform 0.1s linear; 
        }
        .hour-hand { width: 4px; height: 220px; background: linear-gradient(to top, transparent, var(--highlight-red)); }
        .min-hand { width: 3px; height: 305px; background: var(--aviation-orange); z-index: 99; left: calc(50% - 1.5px); }
        .sec-hand { width: 1.5px; height: 315px; background: #ffffff; z-index: 101; left: calc(50% - 0.75px); }
        body.night-mode .sec-hand { background: var(--tactical-green); box-shadow: 0 0 8px var(--tactical-green); }

        .min-tick { position: absolute; width: 2px; height: 8px; background: rgba(255,255,255,0.3); bottom: 50%; left: 50%; transform-origin: bottom center; }
        .min-tick.major { height: 15px; background: rgba(255,255,255,0.6); width: 3px; }
        body.night-mode .min-tick { background: var(--tactical-green); opacity: 0.3; }
        
        .min-number { position: absolute; width: 30px; text-align: center; font-size: 0.7rem; color: var(--aviation-orange); font-weight: bold; z-index: 4; left: calc(50% - 15px); top: calc(50% - 7px); }

        .celestial-icon { position: absolute; width: 30px; height: 30px; z-index: 10; display: flex; justify-content: center; align-items: center; transition: transform 0.5s ease; }
        .sun-emoji { font-size: 1.8rem; color: #FFD700; text-shadow: 0 0 12px rgba(215, 215, 0, 0.8); }
        body.night-mode .sun-emoji { color: var(--tactical-green); text-shadow: 0 0 10px var(--tactical-green); }
        .moon-vector { width: 24px; height: 24px; border-radius: 50%; box-shadow: 8px 8px 0 0 #FFFFFF; transform: rotate(-45deg); }
        body.night-mode .moon-vector { box-shadow: 8px 8px 0 0 var(--tactical-green); }

        .center-mask {
            position: absolute; width: var(--center-mask-size); height: var(--center-mask-size);
            background-color: var(--bg-card); border-radius: 50%;
            z-index: 11; display: flex; justify-content: center; align-items: center;
            transition: background-color 0.3s;
        }
        .center-info { text-align: center; z-index: 12; }
        .info-title { font-weight: 800; font-size: 0.85rem; color: var(--text-main); letter-spacing: 1px; }
        .info-daylight { font-weight: bold; font-size: 0.7rem; color: #b89a3d; margin-top: 5px; }
        body.night-mode .info-daylight { color: var(--tactical-green); opacity: 0.6; }

        .digital-panels { display: flex; gap: 40px; margin-top: 30px; }
        .digital-card { 
            background: var(--bg-card); padding: 15px 25px; min-width: 280px; 
            border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            text-align: center; border-bottom: 4px solid var(--border-ui);
            transition: all 0.3s;
        }
        .card-date { font-size: 0.75rem; font-weight: 800; color: var(--highlight-red); margin-bottom: 2px; text-transform: uppercase; }
        .card-time { font-family: 'Courier New', monospace; font-size: 1.8rem; font-weight: 900; color: var(--text-main); }
        
        .zulu-label { color: var(--aviation-orange); font-size: 0.7rem; font-weight: 800; letter-spacing: 1px; }
        .local-label { color: var(--highlight-red); font-size: 0.7rem; font-weight: 800; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="version-tag">STATION_OS v7.6.8</div>

    <div class="branding-plate">
        <h1>Precision Navigation Chronometer</h1>
        <span>High-Stakes Operational Timing System</span>
    </div>

    <div class="header-controls">
        <div class="night-toggle">
            <span style="font-size: 0.6rem; font-weight: 900; color: #888;">NVG MODE</span>
            <label class="switch"><input type="checkbox" id="nightSwitch"><span class="slider"></span></label>
        </div>
        <div class="input-group"><label>Offset</label><input type="number" id="offsetIn" value="-5" min="-12" max="12" step="1"></div>
        <div class="input-group"><label>Sunrise</label><input type="number" id="sunIn" value="6" min="0" max="23"></div>
        <div class="input-group"><label>Sunset</label><input type="number" id="setIn" value="18" min="0" max="23"></div>
        
        <button class="fs-btn" onclick="toggleFullscreen()">Fullscreen (F)</button>
        
        <div id="zoneText">UTC-5 (ROMEO)</div>
    </div>

    <div class="clock-canvas" id="canvas">
        <svg class="curved-labels" viewBox="0 0 650 650">
            <defs>
                <path id="zuluPath" d="M 115,325 A 210,210 0 0,1 535,325" fill="transparent" />
                <path id="localPath" d="M 215,325 A 110,110 0 0,1 435,325" fill="transparent" />
            </defs>
            <text><textPath href="#zuluPath" startOffset="50%" text-anchor="middle">OUTER RING: UTC TIME (ZULU)</textPath></text>
            <text><textPath href="#localPath" startOffset="50%" text-anchor="middle" id="curvedLocalLabel">INNER RING: LOCAL TIME (ROMEO)</textPath></text>
        </svg>
        <div class="hand hour-hand" id="hHand"></div>
        <div class="hand min-hand" id="mHand"></div>
        <div class="hand sec-hand" id="sHand"></div>
        <div class="inner-disk" id="localDisk">
            <div id="sunIcon" class="celestial-icon"><span class="sun-emoji">&#9728;</span></div>
            <div id="moonIcon" class="celestial-icon"><div class="moon-vector"></div></div>
            <div class="daylight-overlay" id="sunOverlay"></div>
            <div class="center-mask">
                <div class="center-info">
                    <div class="info-title" id="centerTitle">ZULU / ROMEO</div>
                    <div id="daylightText" class="info-daylight">06:00R - 18:00R</div>
                    </div>
            </div>
        </div>
    </div>

    <div class="digital-panels">
        <div class="digital-card" style="border-bottom-color: var(--aviation-orange);">
            <div class="card-date" id="zuluDate" style="color: var(--aviation-orange);">---, --- --</div>
            <div class="card-time" id="zuluDigital">00:00:00Z</div>
            <div class="zulu-label">UTC TIME (ZULU)</div>
        </div>
        <div class="digital-card" style="border-bottom-color: var(--highlight-red);">
            <div class="card-date" id="localDate" style="color: var(--highlight-red);">---, --- --</div>
            <div class="card-time" id="localDigital">00:00:00R</div>
            <div id="localDigitalLabel" class="local-label">LOCAL TIME (ROMEO)</div>
        </div>
    </div>

<script>
    const phonetic = {"-12":"Yankee","-11":"X-ray","-10":"Whiskey","-9":"Victor","-8":"Uniform","-7":"Tango","-6":"Sierra","-5":"Romeo","-4":"Quebec","-3":"Papa","-2":"Oscar","-1":"November","0":"Zulu","1":"Alpha","2":"Bravo","3":"Charlie","4":"Delta","5":"Echo","6":"Foxtrot","7":"Golf","8":"Hotel","9":"India","10":"Kilo","11":"Lima","12":"Mike"};

    const rotState = { sec: 0, min: 0, hour: 0 };

    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                alert(`Error: ${err.message}`);
            });
        } else {
            document.exitFullscreen();
        }
    }

    document.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'f') toggleFullscreen();
    });

    function initMinuteScale() {
        const canvas = document.getElementById('canvas');
        for (let i = 0; i < 60; i++) {
            const ang = i * 6;
            const tick = document.createElement('div');
            tick.className = 'min-tick' + (i % 5 === 0 ? ' major' : '');
            tick.style.transform = `rotate(${ang}deg) translateY(-315px)`;
            canvas.appendChild(tick);
            
            const num = document.createElement('div');
            num.className = 'min-number';
            num.innerText = i.toString().padStart(2, '0');
            num.style.opacity = (i % 5 === 0) ? '1' : '0.4';
            const rad = 295;
            const x = Math.sin(ang * Math.PI / 180) * rad;
            const y = -Math.cos(ang * Math.PI / 180) * rad;
            num.style.transform = `translate(${x}px, ${y}px)`;
            canvas.appendChild(num);
        }
    }

    function initHourScales() {
        const canvas = document.getElementById('canvas');
        const localDisk = document.getElementById('localDisk');
        for (let i = 0; i < 24; i++) {
            const ang = i * 15;
            const zn = document.createElement('div');
            zn.id = `zulu-hr-${i}`;
            zn.className = 'hour-node zulu-ring';
            zn.innerText = i.toString().padStart(2, '0');
            zn.style.transform = `rotate(${ang}deg) translateY(-250px) rotate(-${ang}deg)`;
            canvas.appendChild(zn);

            const ln = document.createElement('div');
            ln.id = `local-hr-${i}`;
            ln.className = 'hour-node local-ring';
            ln.style.transform = `rotate(${ang}deg) translateY(-165px) rotate(-${ang}deg)`;
            localDisk.appendChild(ln);
        }
    }

    function toggleNightMode() {
        if (document.getElementById('nightSwitch').checked) document.body.classList.add('night-mode');
        else document.body.classList.remove('night-mode');
    }

    function calculateRotation(current, targetValue, fullCircle) {
        let currentNormalized = current % fullCircle;
        let delta = targetValue - currentNormalized;
        if (delta < -fullCircle / 2) delta += fullCircle;
        if (delta > fullCircle / 2) delta -= fullCircle;
        return current + delta;
    }

    function tick() {
        const offset = parseInt(document.getElementById('offsetIn').value) || 0;
        const sunrise = parseInt(document.getElementById('sunIn').value) || 0;
        const sunset = parseInt(document.getElementById('setIn').value) || 0;
        const zoneName = phonetic[offset] || "Custom";
        const zoneChar = zoneName.charAt(0).toUpperCase();
        const now = new Date();
        
        const utcSec = now.getUTCSeconds();
        const utcMilli = now.getUTCMilliseconds();
        const utcMin = now.getUTCMinutes();
        const utcHr = now.getUTCHours();

        const targetSec = (utcSec * 6) + (utcMilli * 0.006);
        const targetMin = (utcMin * 6) + (utcSec * 0.1);
        const targetHr = (utcHr * 15) + (utcMin * 0.25);

        rotState.sec = calculateRotation(rotState.sec, targetSec, 360);
        rotState.min = calculateRotation(rotState.min, targetMin, 360);
        rotState.hour = calculateRotation(rotState.hour, targetHr, 360);

        document.getElementById('sHand').style.transform = `rotate(${rotState.sec}deg)`;
        document.getElementById('mHand').style.transform = `rotate(${rotState.min}deg)`;
        document.getElementById('hHand').style.transform = `rotate(${rotState.hour}deg)`;

        const zHrNow = utcHr;
        const lHrNow = (zHrNow + offset + 24) % 24;

        for (let i = 0; i < 24; i++) {
            const zNode = document.getElementById(`zulu-hr-${i}`);
            if (i === zHrNow) zNode.classList.add('active-red');
            else zNode.classList.remove('active-red');

            const lNode = document.getElementById(`local-hr-${i}`);
            const lValue = (i + offset + 24) % 24;
            lNode.innerText = lValue.toString().padStart(2, '0');
            if (lValue === lHrNow) lNode.classList.add('active-red');
            else lNode.classList.remove('active-red');
        }

        const relSunrise = (sunrise - offset + 24) % 24;
        const relSunset = (sunset - offset + 24) % 24;
        const startDeg = relSunrise * 15;
        const endDeg = relSunset * 15;
        let arcLen = (endDeg - startDeg + 360) % 360;
        document.getElementById('sunOverlay').style.background = `conic-gradient(from ${startDeg}deg, var(--daylight-gold) 0deg, var(--daylight-gold) ${arcLen}deg, transparent ${arcLen}deg)`;

        const sunPos = startDeg + (arcLen / 2);
        document.getElementById('sunIcon').style.transform = `rotate(${sunPos}deg) translateY(-130px) rotate(-${sunPos}deg)`;
        const moonPos = (sunPos + 180) % 360;
        document.getElementById('moonIcon').style.transform = `rotate(${moonPos}deg) translateY(-130px) rotate(-${moonPos}deg)`;

        const fullZoneName = zoneName.toUpperCase();
        const offsetSign = offset >= 0 ? '+' : '';
        document.getElementById('curvedLocalLabel').textContent = `INNER RING: LOCAL TIME (${fullZoneName})`;
        
        const dateOptions = { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' };
        const lTime = new Date(now.getTime() + (offset * 3600000));
        
        document.getElementById('zuluDate').innerText = now.toLocaleDateString('en-US', dateOptions).toUpperCase();
        document.getElementById('localDate').innerText = lTime.toLocaleDateString('en-US', dateOptions).toUpperCase();
        document.getElementById('zuluDigital').innerText = `${utcHr.toString().padStart(2,'0')}:${utcMin.toString().padStart(2,'0')}:${utcSec.toString().padStart(2,'0')}Z`;
        document.getElementById('localDigital').innerText = `${lTime.getUTCHours().toString().padStart(2,'0')}:${lTime.getUTCMinutes().toString().padStart(2,'0')}:${lTime.getUTCSeconds().toString().padStart(2,'0')}${zoneChar}`;
        
        // CORRECCIÓN DEL TEXTO DEL RELOJ DIGITAL
        document.getElementById('localDigitalLabel').innerText = `LOCAL TIME (${fullZoneName})`;
        
        document.getElementById('zoneText').innerText = `UTC${offsetSign}${offset} (${fullZoneName})`;
        document.getElementById('centerTitle').innerText = `ZULU / ${fullZoneName}`;
        document.getElementById('daylightText').innerText = `${sunrise.toString().padStart(2,'0')}:00${zoneChar} - ${sunset.toString().padStart(2,'0')}:00${zoneChar}`;
    }

    initMinuteScale();
    initHourScales();
    document.getElementById('nightSwitch').addEventListener('change', toggleNightMode);
    setInterval(tick, 50);
    document.querySelectorAll('input').forEach(i => i.addEventListener('input', tick));
    tick();
</script>
</body>
</html>
